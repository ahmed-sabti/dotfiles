gui:
  theme:
    activeBorderColor:
      - "#a6e3a1"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#a6e3a1"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    searchingActiveBorderColor:
      - "#f9e2af"
  showIcons: true
  nerdFontsVersion: "3"
  border: rounded
git:
  paging:
    colorArg: always
    pager: ""
  autoFetch: true
  autoRefresh: true
startupPopupVersion: -1
os:
  editPreset: nvim
keybinding:
  universal:
    quit: q
