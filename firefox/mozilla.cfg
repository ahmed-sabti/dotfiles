// AutoConfig (first line must be a comment). Installed next to the browser binary.
// New tabs (Cmd+T, +) open the home dashboard. Firefox treats its new-tab URL as an
// "initial page", so the address bar stays EMPTY and focused there: type to search.
try {
  const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
  AboutNewTab.newTabURL = "https://home.example.org/";
} catch (e) {
  Components.utils.reportError("mozilla.cfg: " + e);
}
