# --- AUTOSTART ---
# waybar/swaync given a 1s head start: on a cold compositor start (container
# or real login) they can race Wayland/D-Bus registry readiness and die
# silently before ever showing up -- confirmed live on the arch container.
# hypridle does not need the delay (it degrades gracefully, is not racy).
exec-once = sleep 1 && waybar & sleep 1 && swaync & hypridle
exec-once = hyprpaper
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
