background {
    monitor =
    path = $HOME/.config/hypr/wallpapers/arch.jpg
    color = rgba(30, 30, 46, 1.0)
    
    # Enabled blur for glass effect
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(180, 190, 254)
    inner_color = rgb(30, 30, 46)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    placeholder_text = Enter Password
    hide_input = false
    rounding = 10
    check_color = rgb(166, 227, 161)
    fail_color = rgb(243, 139, 168)
    fail_text = Authentication Failed
    position = 0, -120
    halign = center
    valign = center
}

# Date Label
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %B %d')"
    color = rgb(205, 214, 244)
    font_size = 24
    font_family = CaskaydiaCove Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# Time Label
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgb(205, 214, 244)
    font_size = 120
    font_family = CaskaydiaCove Nerd Font Bold
    position = 0, 200
    halign = center
    valign = center
}