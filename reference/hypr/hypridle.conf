general {
    lock_cmd = pidof hyprlock || hyprlock
    
    # Run the lock command before the PC goes to sleep
    before_sleep_cmd = loginctl lock-session
    
    # Turn on the display when you wake up
    after_sleep_cmd = hyprctl dispatch dpms on
}

# --- Listener 1: Lock Screen after 5 minutes ---
listener {
    timeout = 300                           # 5 minutes
    on-timeout = loginctl lock-session      # Triggers the lock_cmd above
}

# --- Listener 2: Turn off Monitor after 5.5 minutes ---
listener {
    timeout = 330                           # 5.5 minutes
    on-timeout = hyprctl dispatch dpms off  # Turn off screen to save power
    on-resume = hyprctl dispatch dpms on    # Turn on immediately when you move mouse
}
